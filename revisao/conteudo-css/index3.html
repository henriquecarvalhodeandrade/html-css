<style>
    
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        font-size: 1.5em;
        min-height: 300px;
        width: 100%;

        background: lightgray;

        display: grid;

        grid-template-columns: 1fr;
        grid-template-rows: 50px auto 1fr auto;

        gap: 10px;

        grid-template-areas:
            "header"
            "advert"
            "content"
            "footer";
    }


    .item1 {
        background: lightblue;
        grid-area: header;
    }

    .item2 {
        background: lightsalmon;
        grid-area: advert;
    }

    .item3 {
        background: lightcyan;
        grid-area: content;
    }

    .item4 {
        background: lightpink;
        grid-area: footer;
    }

    @media (min-width: 300px) {

        .container {
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "advert header"
                "advert content"
                "advert footer";
        }

    }

    @media (min-width: 600px) {

        .container {

            grid-template-areas:
                "header header"
                "advert content"
                "footer footer";
        }

    }

</style>


<div class="container">

    <div class="item1">
        Header
    </div>

    <div class="item2">
        Advert
    </div>

    <div class="item3">
        Content
    </div>

    <div class="item4">
        Footer
    </div>

</div>
